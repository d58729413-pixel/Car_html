<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🏎️ Обгон 2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#000;color:#fff;font-family:'Courier New',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#game{width:100%;max-width:500px;background:#111;border-radius:12px;padding:10px;position:relative;min-height:100vh;display:flex;flex-direction:column}
h1{text-align:center;color:#f1c40f;font-size:26px;margin:16px 0 6px;letter-spacing:3px;text-shadow:0 0 20px rgba(241,196,15,.5)}
.subtitle{text-align:center;color:#666;font-size:11px;margin-bottom:14px;letter-spacing:2px}
.screen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px}
.screen.active{display:flex}
.menu-btn{display:block;width:100%;padding:18px;margin:8px 0;background:linear-gradient(135deg,#2c3e50,#34495e);color:#fff;border:2px solid #444;border-radius:12px;font-family:inherit;font-size:16px;font-weight:bold;cursor:pointer;transition:.15s;letter-spacing:1px;text-align:center}
.menu-btn:active{transform:scale(.97);background:linear-gradient(135deg,#3498db,#2980b9)}
.menu-btn.blue{background:linear-gradient(135deg,#00b4d8,#0077b6);border-color:#00b4d8}
.menu-btn.pink{background:linear-gradient(135deg,#c98b8b,#a56b6b);border-color:#c98b8b}
.menu-btn.gray{background:linear-gradient(135deg,#95a5a6,#7f8c8d);border-color:#95a5a6}
.menu-btn.gray2{background:linear-gradient(135deg,#bdc3c7,#95a5a6);border-color:#bdc3c7;color:#333}
.admin-mini{display:block;width:auto;padding:6px 20px;margin:0 auto 14px;background:rgba(255,255,255,.08);color:#ccc;border:1px solid #444;border-radius:20px;font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:1px}
.coins-display{text-align:center;color:#f1c40f;font-size:18px;font-weight:bold;margin-top:auto;padding:16px 0 8px;letter-spacing:1px}
canvas{display:block;width:100%;height:auto;border-radius:8px;touch-action:none;background:#000}
.controls{display:flex;justify-content:space-between;margin-top:8px;gap:8px}
.controls.hide{display:none}
.ctrl{flex:1;height:70px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);border-radius:50%;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ctrl:active{background:rgba(233,69,96,.6);transform:scale(.95)}
.btn{display:block;width:100%;padding:11px;margin:5px 0;background:#e94560;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:bold;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.green{background:#2ecc71}.btn.blue{background:#3498db}.btn.gold{background:#f39c12}.btn.dark{background:#2c2c2c;border:1px solid #666}
.overlay{position:absolute;inset:0;background:rgba(10,10,20,.96);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border-radius:12px;padding:16px;text-align:center;z-index:10;overflow-y:auto}
.hidden{display:none!important}
.stat{font-size:13px;margin:3px 0}
.big{font-size:22px;color:#f1c40f;font-weight:bold}
.shop-item{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 10px;background:#0f3460;border-radius:8px;margin:4px 0;font-size:12px;border-left:4px solid #e94560}
.shop-item.bought{border-left-color:#2ecc71;opacity:.7}
.shop-item.owned{border-left-color:#f1c40f;background:#1a3a5c}
.shop-item .info{text-align:left;flex:1}
.shop-item .name{font-weight:bold;color:#fff}
.shop-item .desc{font-size:10px;color:#aaa;margin-top:2px}
.shop-item button{padding:6px 10px;background:#f39c12;border:none;border-radius:6px;color:#000;font-weight:bold;cursor:pointer;font-size:11px}
.shop-item button:disabled{background:#555;color:#999}
.coin{font-size:15px;color:#f1c40f;font-weight:bold;margin-bottom:8px}
.section-title{width:100%;text-align:left;color:#e94560;font-size:11px;font-weight:bold;margin:8px 0 3px;letter-spacing:1px}
.stats-table{width:100%;background:#0f3460;border-radius:10px;padding:14px;margin:8px 0}
.stats-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.stats-row:last-child{border-bottom:none}
.stats-row .val{color:#f1c40f;font-weight:bold}
.admin-input{width:100%;padding:10px;background:#0a0a0a;border:2px solid #e94560;border-radius:8px;color:#fff;font-family:inherit;font-size:14px;text-align:center;margin:10px 0;letter-spacing:2px}
.admin-input:focus{outline:none;border-color:#f1c40f}
.toggle-view{display:flex;gap:8px;margin:8px 0;width:100%}
.toggle-view button{flex:1;padding:10px;background:#0f3460;border:2px solid #444;border-radius:8px;color:#fff;font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer}
.toggle-view button.active{background:#e94560;border-color:#f1c40f}
</style>
</head><body>
<div id="game">

<!-- МЕНЮ -->
<div class="screen active" id="scMenu">
<h1>🏎️ ОБГОН 2.0</h1>
<div class="subtitle">— ГОНКИ ПО ТРАССЕ —</div>
<button class="admin-mini" onclick="openAdminLogin()">🔒 Админ</button>
<button class="menu-btn blue" onclick="startMode('overtake')">🚗 ИГРАТЬ</button>
<button class="menu-btn pink" onclick="startMode('oncoming')">🏁 ВСТРЕЧКА</button>
<button class="menu-btn gray" onclick="showScreen('scStats');renderStats()">📊 СТАТИСТИКА</button>
<button class="menu-btn gray2" onclick="openShop()">🛒 МАГАЗИН</button>
<div class="coins-display">💰 <span id="menuCoins">0</span></div>
</div>

<!-- ИГРА -->
<div class="screen" id="scGame">
<div style="position:relative;width:100%">
<canvas id="road" width="460" height="620"></canvas>
</div>
<div class="controls" id="controls">
<div class="ctrl" id="btnLeft">◀</div>
<div class="ctrl" id="btnRight">▶</div>
</div>
</div>

<!-- СТАТИСТИКА -->
<div class="screen" id="scStats">
<h1 style="font-size:20px">📊 СТАТИСТИКА</h1>
<div class="stats-table" id="statsTable"></div>
<button class="btn blue" onclick="showScreen('scMenu')">↩ НАЗАД</button>
</div>

<!-- МАГАЗИН -->
<div class="screen" id="scShop">
<h1 style="font-size:20px;color:#f39c12">🛒 МАГАЗИН</h1>
<div class="coin">💰 <span id="shopCoins">0</span></div>
<div id="shopList" style="width:100%"></div>
<button class="btn blue" onclick="showScreen('scMenu')">↩ НАЗАД</button>
</div>

<!-- ВЫБОР РЕЖИМА -->
<div class="overlay hidden" id="viewSelect">
<div style="font-size:18px;color:#e94560;font-weight:bold;margin-bottom:8px">🎮 РЕЖИМ</div>
<div style="font-size:12px;color:#aaa;margin-bottom:12px">Как едешь?</div>
<div class="toggle-view">
<button id="vTop" class="active" onclick="setView('top')">☀️ ДЕНЬ</button>
<button id="vFp" onclick="setView('night')">🌙 НОЧЬ</button>
</div>
<div style="font-size:12px;color:#f1c40f;margin:10px 0">🌧️ Погода: <span id="weatherPreview">ясно</span></div>
<button class="btn green" onclick="confirmStart()">▶ НАЧАТЬ</button>
<button class="btn dark" onclick="document.getElementById('viewSelect').classList.add('hidden')">↩ ОТМЕНА</button>
</div>

<!-- АДМИН ВХОД -->
<div class="overlay hidden" id="adminLogin">
<div style="font-size:16px;color:#e94560;font-weight:bold;margin-bottom:4px">🔒 ADMIN LOGIN</div>
<input type="password" id="adminPass" class="admin-input" placeholder="•••••••••" autocomplete="off">
<button class="btn green" onclick="checkPass()">🔓 ВОЙТИ</button>
<button class="btn dark" onclick="closeAdmin()">↩ ОТМЕНА</button>
<div id="adminError" style="color:#e74c3c;font-size:12px;margin-top:6px;height:14px"></div>
</div>

<!-- АДМИН ПАНЕЛЬ -->
<div class="overlay hidden" id="adminPanel">
<div style="font-size:16px;color:#2ecc71;font-weight:bold;margin-bottom:8px">🔓 ADMIN MODE</div>
<div class="coin">💰 Монеты: <span id="adminCoins">0</span></div>
<div class="section-title">💵 ЧИТЫ</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%">
<button class="btn gold" onclick="addCoins(100)">+100💰</button>
<button class="btn gold" onclick="addCoins(1000)">+1000💰</button>
<button class="btn gold" onclick="addCoins(10000)">+10000💰</button>
<button class="btn gold" onclick="addCoins(999999)">+999999💰</button>
</div>
<div class="section-title">🚗 МАШИНЫ</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%">
<button class="btn blue" onclick="giveCar('toyota')">🚗 Toyota</button>
<button class="btn blue" onclick="giveCar('prius')">🌱 Prius</button>
<button class="btn blue" onclick="giveCar('bmw')">🇩🇪 BMW</button>
<button class="btn blue" onclick="giveCar('skyline')">🏁 Skyline</button>
<button class="btn blue" onclick="giveCar('mustang')">🐎 Mustang</button>
<button class="btn blue" onclick="giveCar('lambo')">🐂 Lambo</button>
<button class="btn blue" onclick="maxUpgrades()">⚙ МАКС</button>
</div>
<div class="section-title">🌧 ПОГОДА</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:100%">
<button class="btn blue" onclick="adminWeather='clear'">☀️ Ясно</button>
<button class="btn blue" onclick="adminWeather='rain'">🌧️ Дождь</button>
<button class="btn blue" onclick="adminWeather='random'">🎲 Случ.</button>
</div>
<div class="section-title">⚙ УПРАВЛЕНИЕ</div>
<button class="btn dark" onclick="resetProgress()">🗑 Сброс прогресса</button>
<button class="btn green" onclick="closeAdmin()">↩ ВЫЙТИ</button>
</div>

<!-- GAME OVER -->
<div class="overlay hidden" id="gameover">
<div style="font-size:44px;margin:10px 0">💥</div>
<div style="font-size:20px;color:#e74c3c;font-weight:bold;margin-bottom:16px">АВАРИЯ!</div>
<div class="stat">Обгонов: <span class="big" id="finalOvertakes">0</span></div>
<div class="stat">Очки: <span class="big" id="finalScore">0</span></div>
<div class="stat">Скорость: <span class="big" id="finalSpeed">0</span> км/ч</div>
<div class="coin" style="margin-top:10px">+💰 <span id="earnedCoins">0</span></div>
<button class="btn green" style="margin-top:14px" onclick="restartGame()">🔄 ЗАНОВО</button>
<button class="btn blue" onclick="backToMenu()">🏠 В МЕНЮ</button>
</div>

</div><script>
// ===== АУДИО =====
let AC=null,S=true,eO=null,eG=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){S=false}}
function beep(f,d,t="square",v=.1){if(!S||!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function startEngine(){if(!S||!AC||eO)return;eO=AC.createOscillator();eG=AC.createGain();eO.type="sawtooth";eO.frequency.value=60;eG.gain.value=.03;eO.connect(eG);eG.connect(AC.destination);eO.start()}
function stopEngine(){if(eO){try{eO.stop()}catch(e){}eO=null;eG=null}}
function updEngine(v){if(eO)eO.frequency.value=50+v*.4}

// ===== 6 МАШИН =====
const CARS=[
{id:"toyota",name:"🚗 Старая Toyota",desc:"Стандартная",price:0,stats:{grip:1,accel:1,maxBonus:0,coinBonus:1},color:"#e94560",type:"sedan"},
{id:"prius",name:"🌱 Toyota Prius",desc:"+30% монет",price:150,stats:{grip:1.1,accel:0.95,maxBonus:-10,coinBonus:1.3},color:"#2ecc71",type:"prius"},
{id:"bmw",name:"🇩🇪 BMW M3",desc:"Баланс и скорость",price:300,stats:{grip:1.2,accel:1.1,maxBonus:10,coinBonus:1.1},color:"#1a1a1a",type:"bmw"},
{id:"skyline",name:"🏁 Nissan Skyline",desc:"+25 км/ч макс.",price:400,stats:{grip:1.3,accel:1.2,maxBonus:25,coinBonus:1},color:"#3498db",type:"skyline"},
{id:"mustang",name:"🐎 Ford Mustang",desc:"+15% очков",price:600,stats:{grip:1.15,accel:1.3,maxBonus:15,coinBonus:1.15},color:"#c0392b",type:"mustang"},
{id:"lambo",name:"🐂 Lamborghini",desc:"Топ-кар, +40 км/ч",price:1200,stats:{grip:1.4,accel:1.4,maxBonus:40,coinBonus:1.2},color:"#f1c40f",type:"lambo"}
];
const SHOP=[
{id:"grip",name:"🛞 Спортивные шины",desc:"Плавнее управление",price:60,max:3},
{id:"fuel",name:"⛽ Турбонаддув",desc:"+15 км/ч макс.",price:80,max:5},
{id:"magnet",name:"💎 Драгоценный груз",desc:"+25% очков",price:100,max:3}
];

// ===== СОСТОЯНИЕ =====
const cv=document.getElementById("road"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
let best=+localStorage.getItem("otB")||0,coins=+localStorage.getItem("otC")||0;
let up=JSON.parse(localStorage.getItem("otU")||'{"grip":0,"fuel":0,"magnet":0,"car":"toyota"}');
if(!up.car)up.car="toyota";
let stats=JSON.parse(localStorage.getItem("otStats")||'{"totalGames":0,"totalOvertakes":0,"totalCoins":0,"oncomingBest":0,"crashes":0}');
let mode="overtake",view="top",weather="clear",adminWeather="random";

function getCar(){return CARS.find(c=>c.id===up.car)||CARS[0]}
function save(){localStorage.setItem("otC",coins);localStorage.setItem("otU",JSON.stringify(up));document.getElementById("menuCoins").textContent=coins;document.getElementById("shopCoins").textContent=coins;document.getElementById("adminCoins").textContent=coins}
function saveStats(){localStorage.setItem("otStats",JSON.stringify(stats))}

// ===== ЭКРАНЫ =====
function showScreen(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.getElementById("menuCoins").textContent=coins;
if(id==="scMenu")stopEngine();
}

// ===== СТАТИСТИКА =====
function renderStats(){
const t=document.getElementById("statsTable");
t.innerHTML=`
<div class="stats-row"><span>🎮 Всего игр</span><span class="val">${stats.totalGames}</span></div>
<div class="stats-row"><span>🚗 Обгонов всего</span><span class="val">${stats.totalOvertakes}</span></div>
<div class="stats-row"><span>💰 Монет заработано</span><span class="val">${stats.totalCoins}</span></div>
<div class="stats-row"><span>💥 Аварий</span><span class="val">${stats.crashes}</span></div>
<div class="stats-row"><span>🏁 Рекорд во Встречке</span><span class="val">${stats.oncomingBest}</span></div>
<div class="stats-row"><span>🏆 Рекорд в Обгоне</span><span class="val">${best}</span></div>
<div class="stats-row"><span>🚗 Машина</span><span class="val">${getCar().name}</span></div>
<div class="stats-row"><span>🛞 Шины</span><span class="val">${up.grip||0}/3</span></div>
<div class="stats-row"><span>⛽ Турбо</span><span class="val">${up.fuel||0}/5</span></div>
<div class="stats-row"><span>💎 Груз</span><span class="val">${up.magnet||0}/3</span></div>
`;
}

// ===== МАГАЗИН =====
function openShop(){showScreen("scShop");renderShop()}
function renderShop(){
const L=document.getElementById("shopList");L.innerHTML="";
const t1=document.createElement("div");t1.className="section-title";t1.textContent="⚙ УЛУЧШЕНИЯ";L.appendChild(t1);
SHOP.forEach(it=>{
const lv=up[it.id]||0,mx=lv>=it.max,ok=!mx&&coins>=it.price;
const d=document.createElement("div");d.className="shop-item"+(mx?" bought":"");
d.innerHTML=`<div class="info"><div class="name">${it.name} <span style="color:#f39c12">ур. ${lv}/${it.max}</span></div><div class="desc">${it.desc}</div></div><button ${ok?"":"disabled"}>${mx?"МАКС":`💰 ${it.price}`}</button>`;
if(ok)d.querySelector("button").onclick=()=>buyUp(it);
L.appendChild(d)});
const t2=document.createElement("div");t2.className="section-title";t2.textContent="🚗 МАШИНЫ (6)";L.appendChild(t2);
CARS.forEach(c=>{
const owned=up.car===c.id,canBuy=!owned&&coins>=c.price;
const d=document.createElement("div");d.className="shop-item"+(owned?" owned":"");
const s=c.stats;
let btnTxt=owned?"✓ ВЫБРАНА":(c.price===0?"ВЫБРАТЬ":`💰 ${c.price}`);
d.innerHTML=`<div class="info"><div class="name">${c.name}</div><div class="desc">${c.desc}<br><span style="color:#6cf">+${s.maxBonus} км/ч · ×${s.grip} руль · ×${s.coinBonus} монет</span></div></div><button ${(!owned&&c.price>0&&!canBuy)?"disabled":""}>${btnTxt}</button>`;
const btn=d.querySelector("button");
if(owned)btn.disabled=true;
else if(c.price===0||canBuy)btn.onclick=()=>buyCar(c);
L.appendChild(d)});
}
function buyUp(it){const lv=up[it.id]||0;if(lv>=it.max||coins<it.price)return;coins-=it.price;up[it.id]=lv+1;save();beep(660,.1,"sine",.1);setTimeout(()=>beep(990,.15,"sine",.1),80);renderShop()}
function buyCar(c){if(up.car===c.id)return;if(c.price>0){if(coins<c.price)return;coins-=c.price}up.car=c.id;save();beep(660,.1,"sine",.1);setTimeout(()=>beep(990,.15,"sine",.1),80);setTimeout(()=>beep(1320,.2,"sine",.1),160);renderShop()}

// ===== ВЫБОР РЕЖИМА + ПОГОДА =====
function startMode(m){
mode=m;
document.getElementById("viewSelect").classList.remove("hidden");
if(adminWeather==="rain")weather="rain";
else if(adminWeather==="clear")weather="clear";
else weather=Math.random()<0.3?"rain":"clear";
document.getElementById("weatherPreview").textContent=weather==="rain"?"🌧️ дождь":"☀️ ясно";
}
function setView(v){
view=v;
document.getElementById("vTop").classList.toggle("active",v==="top");
document.getElementById("vFp").classList.toggle("active",v==="night");
beep(440,.05);
}
function confirmStart(){
document.getElementById("viewSelect").classList.add("hidden");
startGame();
}

// ===== АДМИН =====
const ADMIN_PASS="BeanNewgeme3";
function openAdminLogin(){beep(440,.05);document.getElementById("adminLogin").classList.remove("hidden");document.getElementById("adminPass").value="";document.getElementById("adminError").textContent="";setTimeout(()=>document.getElementById("adminPass").focus(),100)}
function checkPass(){const v=document.getElementById("adminPass").value;if(v===ADMIN_PASS){beep(880,.1,"sine",.1);setTimeout(()=>beep(1320,.15,"sine",.1),80);document.getElementById("adminLogin").classList.add("hidden");document.getElementById("adminPanel").classList.remove("hidden");document.getElementById("adminCoins").textContent=coins}else{beep(200,.2,"sawtooth",.15);document.getElementById("adminError").textContent="❌ НЕВЕРНЫЙ ПАРОЛЬ";document.getElementById("adminPass").value=""}}
function closeAdmin(){beep(440,.05);document.getElementById("adminLogin").classList.add("hidden");document.getElementById("adminPanel").classList.add("hidden")}
function addCoins(n){coins+=n;save();beep(660,.08,"sine",.1)}
function giveCar(id){up.car=id;save();beep(660,.1,"sine",.1)}
function maxUpgrades(){up.grip=3;up.fuel=5;up.magnet=3;save();beep(660,.1,"sine",.1);setTimeout(()=>beep(1320,.2,"sine",.1),100)}
function resetProgress(){if(!confirm("Сбросить ВЕСЬ прогресс?"))return;localStorage.clear();location.reload()}
document.getElementById("adminPass").addEventListener("keydown",e=>{if(e.key==="Enter")checkPass()});// ===== ИГРА =====
let g=null;
function startGame(){
initAudio();
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("scGame").classList.add("active");
document.getElementById("gameover").classList.add("hidden");
document.getElementById("controls").classList.remove("hide");
const car=getCar(),s=car.stats;
g={run:1,mode:mode,view:view,weather:weather,
p:{x:W/2,y:H-110,w:40,h:66,sp:5.5*(1+(up.grip||0)*0.08)*s.grip,tx:W/2,ti:0,color:car.color,type:car.type},
cars:[],sc:0,ov:0,spd:60,bs:4*s.accel,ms:(200+(up.fuel||0)*15+s.maxBonus),
st:0,si:70,k:{l:0,r:0},sh:0,mg:(1+(up.magnet||0)*0.25)*s.coinBonus,rs:0,rainDrops:[],flicker:0};
if(g.weather==="rain"){for(let i=0;i<80;i++)g.rainDrops.push({x:Math.random()*W,y:Math.random()*H,sp:8+Math.random()*6,len:8+Math.random()*10});}
stats.totalGames++;saveStats();
setup();startEngine();loop();
}
function restartGame(){startGame()}
function backToMenu(){if(g)g.run=0;stopEngine();document.getElementById("gameover").classList.add("hidden");document.getElementById("controls").classList.add("hide");showScreen("scMenu")}

function setup(){
const pL=e=>{e.preventDefault();if(g)g.k.l=1},pR=e=>{e.preventDefault();if(g)g.k.r=1},rL=e=>{e.preventDefault();if(g)g.k.l=0},rR=e=>{e.preventDefault();if(g)g.k.r=0};
const bL=document.getElementById("btnLeft"),bR=document.getElementById("btnRight");
const nL=bL.cloneNode(true),nR=bR.cloneNode(true);
bL.parentNode.replaceChild(nL,bL);bR.parentNode.replaceChild(nR,bR);
nL.addEventListener("touchstart",pL);nL.addEventListener("touchend",rL);nL.addEventListener("mousedown",pL);nL.addEventListener("mouseup",rL);nL.addEventListener("mouseleave",rL);
nR.addEventListener("touchstart",pR);nR.addEventListener("touchend",rR);nR.addEventListener("mousedown",pR);nR.addEventListener("mouseup",rR);nR.addEventListener("mouseleave",rR);
let tx=null;cv.ontouchstart=e=>tx=e.touches[0].clientX;
cv.ontouchmove=e=>{if(tx===null||!g)return;const d=e.touches[0].clientX-tx;g.p.tx=Math.max(70,Math.min(W-70,g.p.tx+d*.8));tx=e.touches[0].clientX};
cv.ontouchend=()=>tx=null;
document.onkeydown=e=>{if(!g)return;if(e.key==="ArrowLeft"||e.key==="a")g.k.l=1;if(e.key==="ArrowRight"||e.key==="d")g.k.r=1};
document.onkeyup=e=>{if(!g)return;if(e.key==="ArrowLeft"||e.key==="a")g.k.l=0;if(e.key==="ArrowRight"||e.key==="d")g.k.r=0};
}

function loop(){if(!g||!g.run)return;update();draw();requestAnimationFrame(loop)}

function update(){
const x=g;
const rainPenalty=x.weather==="rain"?0.85:1;
x.spd=Math.min(x.ms,60+x.ov*3);
const sf=(x.bs+(x.spd-60)*.025)*rainPenalty;
x.rs=(x.rs+sf*3)%60;
if(x.k.l)x.p.tx-=x.p.sp;if(x.k.r)x.p.tx+=x.p.sp;
x.p.tx=Math.max(70,Math.min(W-70,x.p.tx));
x.p.x+=(x.p.tx-x.p.x)*.25;x.p.ti=(x.p.tx-x.p.x)*.05;
x.st++;
if(x.st>x.si){x.st=0;x.si=Math.max(30,70-x.ov*1.5);spawn()}
x.cars.forEach(c=>{if(x.mode==="oncoming")c.y+=sf*c.rs*1.8;else c.y+=sf*c.rs;});
x.cars=x.cars.filter(c=>c.y<H+120&&c.y>-200);
x.cars.forEach(c=>{if(!c.ot&&c.y>x.p.y+30){c.ot=1;x.ov++;const pts=x.mode==="oncoming"?Math.floor((15+x.spd/15)*x.mg):Math.floor((10+x.spd/20)*x.mg);x.sc+=pts;beep(880,.08,"square",.06);}});
if(x.weather==="rain"){x.rainDrops.forEach(d=>{d.y+=d.sp*(x.spd/60);d.x-=1.5;if(d.y>H){d.y=-10;d.x=Math.random()*W}});}
if(x.view==="night")x.flicker=Math.random()*0.12;
for(const c of x.cars)if(Math.abs(c.x-x.p.x)<(c.w+x.p.w)/2-6&&Math.abs(c.y-x.p.y)<(c.h+x.p.h)/2-8){crash();return}
if(x.sh>0)x.sh*=.9;
updEngine(x.spd);
}

function spawn(){
const x=g,mid=W/2,lanes=[mid-110,mid,mid+110];
const free=lanes.filter(l=>!x.cars.some(c=>Math.abs(c.x-l)<55&&(c.y>-80||c.y>H-80)));
if(!free.length)return;
const ln=free[Math.floor(Math.random()*free.length)];
const col=["#c0392b","#2980b9","#27ae60","#d35400","#8e44ad","#16a085","#7f8c8d","#2c3e50","#34495e","#e67e22"];
const tr=Math.random()<.15;
const types=["sedan","sedan","suv","bmw","skyline","prius"];
const type=tr?"truck":types[Math.floor(Math.random()*types.length)];
const yStart=x.mode==="oncoming"?-120:-100;
x.cars.push({x:ln,y:yStart,w:tr?50:42,h:tr?100:70,c:tr?"#5d6d7e":col[Math.floor(Math.random()*col.length)],rs:.5+Math.random()*.4,ot:0,tr,type});
}

function draw(){
const x=g;ctx.save();
if(x.sh>.5)ctx.translate((Math.random()-.5)*x.sh,(Math.random()-.5)*x.sh);

const isNight=x.view==="night";
const isRain=x.weather==="rain";

ctx.fillStyle=isNight?"#02020a":"#0a0a0a";ctx.fillRect(0,0,W,H);
const sideW=70;

ctx.fillStyle=isNight?"#051005":(isRain?"#0d1a0d":"#1a3a1a");
ctx.fillRect(0,0,sideW,H);ctx.fillRect(W-sideW,0,sideW,H);

ctx.fillStyle="#333";ctx.fillRect(sideW,0,6,H);ctx.fillRect(W-sideW-6,0,6,H);

ctx.fillStyle=isNight?"#0d0d0d":(isRain?"#2a2a2a":"#3a3a3a");
ctx.fillRect(sideW+6,0,W-(sideW+6)*2,H);

ctx.fillStyle=isNight?"#080808":"#333";
for(let i=0;i<14;i++){const y=(i*60+x.rs*2)%(H+60)-60;ctx.fillRect(sideW+6,y,W-(sideW+6)*2,2)}

// Разметка
ctx.fillStyle=isNight?"#ffe600":"#f1c40f";
ctx.shadowColor=isNight?"#ffe600":"transparent";
ctx.shadowBlur=isNight?12:0;
ctx.fillRect(sideW+12,0,4,H);ctx.fillRect(W-sideW-16,0,4,H);
ctx.shadowBlur=0;

// Пунктир
ctx.fillStyle=isNight?"#c0c0ff":"#ddd";
ctx.shadowColor=isNight?"#a0a0ff":"transparent";
ctx.shadowBlur=isNight?8:0;
const dof=(x.rs*2)%60;
for(let i=0;i<18;i++){const y=i*60-dof;ctx.fillRect(W/2-55,y,3,32);ctx.fillRect(W/2+52,y,3,32)}
ctx.shadowBlur=0;

// Ночной конус света от фар игрока
if(isNight){
const px=x.p.x,py=x.p.y;
const grad=ctx.createRadialGradient(px,py,20,px,py,320);
grad.addColorStop(0,"rgba(255,240,180,0.35)");
grad.addColorStop(0.5,"rgba(255,220,120,0.15)");
grad.addColorStop(1,"rgba(255,200,80,0)");
ctx.fillStyle=grad;
ctx.beginPath();
ctx.moveTo(px-20,py);
ctx.lineTo(px-260,0);
ctx.lineTo(px+260,0);
ctx.lineTo(px+20,py);
ctx.closePath();
ctx.fill();
if(x.flicker>0.08){ctx.fillStyle="rgba(255,255,200,"+x.flicker+")";ctx.fillRect(0,0,W,py);}
}

// Машины
x.cars.forEach(c=>drawCar(c.x,c.y,c.w,c.h,c.c,c.type,0,0,isNight));
drawCar(x.p.x,x.p.y,x.p.w,x.p.h,x.p.color,x.p.type,x.p.ti,1,isNight);

// Дождь
if(isRain){
ctx.strokeStyle="rgba(150,200,255,.6)";ctx.lineWidth=1.5;
x.rainDrops.forEach(d=>{ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-2,d.y+d.len);ctx.stroke();});
}

// Ночная виньетка
if(isNight){
const vg=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
vg.addColorStop(0,"rgba(0,0,0,0)");
vg.addColorStop(1,"rgba(0,0,0,0.65)");
ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

hud();ctx.restore();
}

function drawCar(x,y,w,h,col,type="sedan",ti=0,pl=0,isNight=false){
ctx.save();ctx.translate(x,y);if(ti)ctx.rotate(ti*.05);
ctx.fillStyle="rgba(0,0,0,.55)";rr(-w/2+3,-h/2+3,w,h,6);ctx.fill();

if(isNight){
ctx.shadowColor="#fff9c4";ctx.shadowBlur=15;
ctx.fillStyle="#fff9c4";
ctx.fillRect(-w/2+3,-h/2-2,w-6,4);
ctx.shadowBlur=0;
}

if(type==="prius"){
const body="#e8f0e8",roof="#f5f5f5",glass="#4a6a7a";
ctx.fillStyle=col;rr(-w/2,-h/2,w,h,8);ctx.fill();
ctx.fillStyle=body;rr(-w/2+3,-h/2+3,w-6,h-6,7);ctx.fill();
ctx.fillStyle=glass;rr(-w/2+5,-h/2+4,w-10,14,4);ctx.fill();
ctx.fillStyle=glass;rr(-w/2+5,h/2-18,w-10,14,4);ctx.fill();
ctx.fillStyle=roof;rr(-w/2+6,-h/2+20,w-12,h-42,3);ctx.fill();
ctx.fillStyle="rgba(0,0,0,.15)";ctx.fillRect(-w/2+6,-h/2+32,w-12,2);
ctx.fillStyle=body;ctx.fillRect(-w/2-2,-h/2+16,3,5);ctx.fillRect(w/2-1,-h/2+16,3,5);
ctx.fillStyle="#fff";ctx.fillRect(-w/2+4,-h/2+1,8,3);ctx.fillRect(w/2-12,-h/2+1,8,3);
ctx.fillStyle=pl?"#ff5555":"#c0392b";ctx.fillRect(-w/2+3,h/2-4,7,3);ctx.fillRect(w/2-10,h/2-4,7,3);
ctx.fillStyle="#111";ctx.fillRect(-w/2-1,-h/2+8,3,12);ctx.fillRect(w/2-2,-h/2+8,3,12);ctx.fillRect(-w/2-1,h/2-22,3,12);ctx.fillRect(w/2-2,h/2-22,3,12);
ctx.strokeStyle="rgba(0,0,0,.4)";ctx.lineWidth=1;rr(-w/2,-h/2,w,h,8);ctx.stroke();
}
else if(type==="skyline"){
const glass="#1a2a3a";
ctx.fillStyle=col;rr(-w/2,-h/2,w,h,5);ctx.fill();
ctx.fillStyle="#2c5a8c";rr(-w/2+2,-h/2+2,w-4,18,3);ctx.fill();
ctx.fillStyle="#111";ctx.fillRect(-w/2+8,-h/2+6,w-16,4);
ctx.fillStyle=glass;ctx.beginPath();ctx.moveTo(-w/2+4,-h/2+20);ctx.lineTo(w/2-4,-h/2+20);ctx.lineTo(w/2-6,-h/2+34);ctx.lineTo(-w/2+6,-h/2+34);ctx.closePath();ctx.fill();
ctx.fillStyle="#3a6a9c";rr(-w/2+5,-h/2+34,w-10,h-58,3);ctx.fill();
ctx.fillStyle=glass;ctx.beginPath();ctx.moveTo(-w/2+6,h/2-24);ctx.lineTo(w/2-6,h/2-24);ctx.lineTo(w/2-4,h/2-10);ctx.lineTo(-w/2+4,h/2-10);ctx.closePath();ctx.fill();
ctx.fillStyle="#0a0a0a";ctx.fillRect(-w/2+2,h/2-9,w-4,4);
ctx.fillStyle="#1a1a1a";ctx.fillRect(-w/2+6,h/2-6,w-12,2);
ctx.fillStyle="#111";ctx.fillRect(-w/2-2,-h/2+22,3,4);ctx.fillRect(w/2-1,-h/2+22,3,4);
ctx.fillStyle="#fff";ctx.fillRect(-w/2+3,-h/2+1,9,4);ctx.fillRect(w/2-12,-h/2+1,9,4);
ctx.fillStyle=pl?"#ff3333":"#8b0000";ctx.beginPath();ctx.arc(-w/2+9,h/2-4,3,0,7);ctx.fill();ctx.beginPath();ctx.arc(w/2-9,h/2-4,3,0,7);ctx.fill();
ctx.fillStyle="#666";ctx.fillRect(-w/2+6,h/2-2,4,2);ctx.fillRect(w/2-10,h/2-2,4,2);
ctx.fillStyle="#0a0a0a";ctx.fillRect(-w/2-1,-h/2+10,3,14);ctx.fillRect(w/2-2,-h/2+10,3,14);ctx.fillRect(-w/2-1,h/2-24,3,14);ctx.fillRect(w/2-2,h/2-24,3,14);
ctx.strokeStyle="rgba(0,0,0,.5)";ctx.lineWidth=1;rr(-w/2,-h/2,w,h,5);ctx.stroke();
}
else if(type==="bmw"){
const glass="#1a2a3a";
ctx.fillStyle=col;rr(-w/2,-h/2,w,h,6);ctx.fill();
ctx.fillStyle="#222";rr(-w/2+3,-h/2+2,w-6,16,4);ctx.fill();
ctx.fillStyle=glass;rr(-w/2+5,-h/2+20,w-10,14,4);ctx.fill();
ctx.fillStyle="#333";rr(-w/2+6,-h/2+34,w-12,h-56,3);ctx.fill();
ctx.fillStyle=glass;rr(-w/2+5,h/2-20,w-10,12,4);ctx.fill();
ctx.fillStyle="#4a90d9";ctx.beginPath();ctx.arc(0,-h/2+10,4,0,7);ctx.fill();
ctx.fillStyle="#fff";ctx.fillRect(-w/2+4,-h/2+2,8,4);ctx.fillRect(w/2-12,-h/2+2,8,4);
ctx.fillStyle=pl?"#ff5555":"#c0392b";ctx.fillRect(-w/2+4,h/2-4,8,3);ctx.fillRect(w/2-12,h/2-4,8,3);
ctx.fillStyle="#0a0a0a";ctx.fillRect(-w/2-1,-h/2+8,3,14);ctx.fillRect(w/2-2,-h/2+8,3,14);ctx.fillRect(-w/2-1,h/2-22,3,14);ctx.fillRect(w/2-2,h/2-22,3,14);
}
else if(type==="mustang"){
ctx.fillStyle=col;rr(-w/2,-h/2,w,h,6);ctx.fill();
ctx.fillStyle="rgba(0,0,0,.4)";ctx.fillRect(-w/2+4,-h/2+12,w-8,4);
ctx.fillStyle="rgba(0,0,0,.4)";ctx.fillRect(-w/2+4,-h/2+30,w-8,4);
ctx.fillStyle="#1a1a1a";rr(-w/2+4,-h/2+2,w-8,10,3);ctx.fill();
ctx.fillStyle="#2a2a2a";rr(-w/2+5,-h/2+20,w-10,14,3);ctx.fill();
ctx.fillStyle="#2a2a2a";rr(-w/2+6,h/2-18,w-12,10,3);ctx.fill();
ctx.fillStyle="#fff";ctx.fillRect(-w/2+3,-h/2,10,4);ctx.fillRect(w/2-13,-h/2,10,4);
ctx.fillStyle=pl?"#ff5555":"#c0392b";ctx.fillRect(-w/2+3,h/2-5,10,4);ctx.fillRect(w/2-13,h/2-5,10,4);
ctx.fillStyle="#0a0a0a";ctx.fillRect(-w/2-1,-h/2+8,3,14);ctx.fillRect(w/2-2,-h/2+8,3,14);ctx.fillRect(-w/2-1,h/2-22,3,14);ctx.fillRect(w/2-2,h/2-22,3,14);
}
else if(type==="lambo"){
ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-w/2+2,-h/2);ctx.lineTo(w/2-2,-h/2);ctx.lineTo(w/2,h/2);ctx.lineTo(-w/2,h/2);ctx.closePath();ctx.fill();
ctx.fillStyle="#111";rr(-w/2+3,-h/2+2,w-6,16,3);ctx.fill();
ctx.fillStyle="#222";ctx.beginPath();ctx.moveTo(-w/2+5,-h/2+20);ctx.lineTo(w/2-5,-h/2+20);ctx.lineTo(w/2-7,-h/2+34);ctx.lineTo(-w/2+7,-h/2+34);ctx.closePath();ctx.fill();
ctx.fillStyle="#222";ctx.beginPath();ctx.moveTo(-w/2+7,h/2-22);ctx.lineTo(w/2-7,h/2-22);ctx.lineTo(w/2-5,h/2-8);ctx.lineTo(-w/2+5,h/2-8);ctx.closePath();ctx.fill();
ctx.fillStyle="#0a0a0a";ctx.fillRect(-w/2+1,h/2-12,w-2,5);
ctx.fillStyle="#fff";ctx.fillRect(-w/2+2,-h/2,10,4);ctx.fillRect(w/2-12,-h/2,10,4);
ctx.fillStyle=pl?"#ff3333":"#8b0000";ctx.fillRect(-w/2+2,h/2-4,10,3);ctx.fillRect(w/2-12,h/2-4,10,3);
ctx.fillStyle="#0a0a0a";ctx.fillRect(-w/2-1,-h/2+8,3,14);ctx.fillRect(w/2-2,-h/2+8,3,14);ctx.fillRect(-w/2-1,h/2-22,3,14);ctx.fillRect(w/2-2,h/2-22,3,14);
}
else{
ctx.fillStyle=col;rr(-w/2,-h/2,w,h,5);ctx.fill();
ctx.fillStyle="rgba(0,0,0,.4)";rr(-w/2+5,-h/2+18,w-10,h-34,3);ctx.fill();
ctx.fillStyle="rgba(150,200,255,.5)";rr(-w/2+6,-h/2+8,w-12,10,2);ctx.fill();
ctx.fillStyle="rgba(150,200,255,.3)";rr(-w/2+6,h/2-18,w-12,8,2);ctx.fill();
ctx.fillStyle="#fff";ctx.fillRect(-w/2+4,-h/2,7,5);ctx.fillRect(w/2-11,-h/2,7,5);
ctx.fillStyle=pl?"#ff6b6b":"#e74c3c";ctx.fillRect(-w/2+4,h/2-5,7,5);ctx.fillRect(w/2-11,h/2-5,7,5);
ctx.fillStyle="#0a0a0a";ctx.fillRect(-w/2-1,-h/2+8,3,13);ctx.fillRect(w/2-2,-h/2+8,3,13);ctx.fillRect(-w/2-1,h/2-21,3,13);ctx.fillRect(w/2-2,h/2-21,3,13);
}
ctx.restore();
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

function hud(){
const x=g;ctx.textAlign="left";
ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(10,10,110,46);
ctx.fillStyle="#f1c40f";ctx.font="bold 22px 'Courier New'";ctx.fillText(Math.round(x.spd),18,40);
ctx.fillStyle="#aaa";ctx.font="10px 'Courier New'";ctx.fillText("км/ч",72,40);
ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(W-155,10,145,46);
ctx.fillStyle="#2ecc71";ctx.font="bold 16px 'Courier New'";ctx.fillText("🏆 "+x.sc,W-145,30);
ctx.fillStyle="#aaa";ctx.font="10px 'Courier New'";ctx.fillText("Обгоны: "+x.ov,W-145,48);
ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(W-100,64,90,26);
ctx.fillStyle="#f1c40f";ctx.font="bold 13px 'Courier New'";ctx.fillText("💰 "+Math.floor(x.sc/5),W-90,82);
if(x.weather==="rain"){
ctx.fillStyle="rgba(100,150,255,.4)";ctx.fillRect(10,64,90,22);
ctx.fillStyle="#9cf";ctx.font="bold 11px 'Courier New'";ctx.fillText("🌧️ ДОЖДЬ",20,80);
}
if(x.mode==="oncoming"){
ctx.fillStyle="rgba(233,69,96,.5)";ctx.fillRect(10,92,120,22);
ctx.fillStyle="#fff";ctx.font="bold 11px 'Courier New'";ctx.fillText("🏁 ВСТРЕЧКА",20,108);
}
if(x.view==="night"){
ctx.fillStyle="rgba(100,50,200,.5)";ctx.fillRect(10,120,90,22);
ctx.fillStyle="#c9f";ctx.font="bold 11px 'Courier New'";ctx.fillText("🌙 НОЧЬ",20,136);
}
}

function crash(){
const x=g;x.run=0;x.sh=30;stopEngine();beep(120,.4,"sawtooth",.2);setTimeout(()=>beep(80,.3,"sawtooth",.15),50);
ctx.fillStyle="rgba(255,100,0,.6)";ctx.beginPath();ctx.arc(x.p.x,x.p.y,45,0,7);ctx.fill();
const e=Math.floor(x.sc/5);coins+=e;
stats.totalCoins+=e;stats.totalOvertakes+=x.ov;stats.crashes++;saveStats();
if(x.mode==="oncoming"&&x.sc>stats.oncomingBest)stats.oncomingBest=x.sc;
if(x.mode==="overtake"&&x.sc>best){best=x.sc;localStorage.setItem("otB",best)}
save();
setTimeout(()=>{
document.getElementById("finalOvertakes").textContent=x.ov;
document.getElementById("finalScore").textContent=x.sc;
document.getElementById("finalSpeed").textContent=Math.round(x.spd);
document.getElementById("earnedCoins").textContent=e;
document.getElementById("gameover").classList.remove("hidden");
},400);
}
</script>
</body>
</html>
