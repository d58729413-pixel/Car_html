var S={coins:0,owned:[0],active:0,best:0,
done:[],recBeats:0,clownCoins:0,toiletCoins:0,
beanDone:false,offroadBest:0,offroadDist:0,f1Used:false,
secretFound:false,bossBeaten:false};

try{
var d=JSON.parse(localStorage.getItem('obgon12')||'{}');
if(d.S)for(var k in d.S)S[k]=d.S[k];
}catch(e){}

function save(){
localStorage.setItem('obgon12',JSON.stringify({S:S}));
}
setInterval(save,5000);

function $(id){return document.getElementById(id);}

function fmt(n){
if(!isFinite(n))return'∞';
if(n<1000)return Math.floor(n)+'';
if(n<1e6)return(n/1e3).toFixed(1)+'K';
if(n<1e9)return(n/1e6).toFixed(1)+'M';
if(n<1e12)return(n/1e9).toFixed(1)+'B';
return(n/1e12).toFixed(1)+'T';
}

function toast(txt){
var el=$('toast');
el.textContent=txt;
el.classList.add('on');
setTimeout(function(){el.classList.remove('on')},2500);
}

function updateClownHud(){
var h=$('clownHud');
if(S.clownCoins>0){
h.style.display='block';
$('clownCount').textContent=S.clownCoins;
}else h.style.display='none';
var t=$('toiletHud');
if(S.toiletCoins>0){
t.style.display='block';
$('toiletCount').textContent=S.toiletCoins;
}else t.style.display='none';
}

function checkAch(st){
var nd=false;
for(var i=0;i<ACHS.length;i++){
var a=ACHS[i];
if(S.done.indexOf(a.id)>=0)continue;
if(a.chk(st)){
S.done.push(a.id);
S.coins+=a.r;
nd=true;
toast('🏆 '+a.n+'\n+'+a.r+'💰');
}
}
if(nd)save();
return nd;
}function showMenu(){
$('menu').classList.remove('h');
$('garage').classList.add('h');
$('over').classList.add('h');
$('ach').classList.add('h');
$('hud').classList.add('h');
$('ctrl').classList.add('h');
$('pedals').classList.add('h');
$('pedals').style.display='none';
$('hpBar').style.display='none';
$('mc').textContent=fmt(S.coins);
gameOn=false;
gameMode='overtake';
f1Mode=false;
save();
}

function showGarage(){
$('menu').classList.add('h');
$('garage').classList.remove('h');
renderG();
}

function showAch(){
$('menu').classList.add('h');
$('ach').classList.remove('h');
renderA();
}

function renderA(){
var al=$('al');
al.innerHTML='';
$('ac').textContent=fmt(S.coins);
$('ap').textContent=S.done.length;
for(var i=0;i<ACHS.length;i++){
var a=ACHS[i];
var done=S.done.indexOf(a.id)>=0;
var div=document.createElement('div');
div.className='ac'+(done?' done':'');
div.innerHTML='<div class="i"><div class="n">'+
a.n+'</div><div class="d">'+a.d+
'</div></div><div class="rew">'+
(done?'✓ ':'')+a.r+'💰</div>';
al.appendChild(div);
}
}

function renderG(){
var g=$('gl');
g.innerHTML='';
$('gc').textContent=fmt(S.coins);
for(var i=0;i<CARS.length;i++){
var c=CARS[i];
var own=S.owned.indexOf(i)>=0;
var act=S.active===i;
var div=document.createElement('div');
div.className='cc'+(own?' on':'')+(act?' act':'');
div.innerHTML='<div class="i"><div class="n" style="color:'+c.c+'">'+c.n+
'</div><div class="d">⭐ x'+c.m+'</div></div>';
var b=document.createElement('button');
if(act){b.textContent='✓';b.className='act';b.disabled=1;}
else if(own){
b.textContent='Выбрать';b.className='on';
b.onclick=(function(idx){return function(){
S.active=idx;save();renderG();
};})(i);
}else{
b.textContent=S.coins>=c.p?fmt(c.p)+'💰':'🔒 '+fmt(c.p);
b.disabled=S.coins<c.p;
b.onclick=(function(idx,pr){return function(){
if(S.coins>=pr){
S.coins-=pr;S.owned.push(idx);S.active=idx;
save();renderG();
checkAch({obgony:0,sess:0,dist:0,
owned:S.owned,recBeats:S.recBeats,
clownCoins:S.clownCoins,
toiletCoins:S.toiletCoins,
f1Used:S.f1Used,offroadDist:S.offroadDist,
secretFound:S.secretFound,bossBeaten:S.bossBeaten});
}
};})(i,c.p);
}
div.appendChild(b);g.appendChild(div);
}
}

function adminStartF1(){

function adminGive(n){
S.coins+=n;
save();
var log=$('adminLog');
if(log)log.textContent='+'+n+' 💰 выдано';
}

function adminUnlockAll(){
S.owned=[];
for(var i=0;i<CARS.length;i++)S.owned.push(i);
save();
var log=$('adminLog');
if(log)log.textContent='Все машины открыты!';
}

function adminUnlockAch(){
S.done=[];
for(var i=0;i<ACHS.length;i++)S.done.push(ACHS[i].id);
save();
var log=$('adminLog');
if(log)log.textContent='Все достижения открыты!';
}

function adminAddClown(){
S.clownCoins=(S.clownCoins||0)+1;
save();updateClownHud();
var log=$('adminLog');
if(log)log.textContent='+1 🤡';
}

function adminAddToilet(){
S.toiletCoins=(S.toiletCoins||0)+1;
save();updateClownHud();
var log=$('adminLog');
if(log)log.textContent='+1 🚽';
}

function adminReset(){
if(!confirm('Точно сбросить ВСЁ?'))return;
localStorage.removeItem('obgon12');
location.reload();
}

function closeAdmin(){
$('admin').style.display='none';
}

function update(dt){

else if(gameMode==='offroad')updateOffroad(dt);
else if(gameMode==='secret')updateSecret(dt);
}

function updateOvertake(dt){
if(inp.l)P.vx-=0.8;
if(inp.r)P.vx+=0.8;
P.vx*=0.85;
if(P.vx>8)P.vx=8;
if(P.vx<-8)P.vx=-8;
P.x+=P.vx;

var rw=W*0.65;
var rx=(W-rw)/2;
var mn=rx+P.w/2;
var mx=rx+rw-P.w/2;
if(P.x<mn){P.x=mn;P.vx=0;}
if(P.x>mx){P.x=mx;P.vx=0;}

for(var i=0;i<lines.length;i++){
lines[i].y+=7;
if(lines[i].y>H+40)lines[i].y=-40;
}
bgOff+=7;

for(i=0;i<enemies.length;i++){
var e=enemies[i];
e.y+=e.s;
if(Math.abs(e.x-P.x)<P.w-6&&Math.abs(e.y-P.y)<P.h-6){
gameOn=false;crash('overtake');return;
}
if(!e.pass&&e.y>P.y+P.h/2){
e.pass=1;obgony++;
var mult=CARS[S.active].m;
if(f1Mode)mult=F1.m;
if(beanBonus)mult*=2;
var g=Math.floor(10*mult);
coins+=g;sess+=g;
floats.push({t:'+'+g,x:e.x,y:e.y,l:1});
}
}

enemies=enemies.filter(function(e){return e.y<H+200;});
if(!noEnemies&&enemies.length<6&&Math.random()<0.04)spawnE(-150);

dist+=1.4;
speed=Math.floor(180+Math.abs(P.vx)*20);

$('coins').textContent=fmt(S.coins+coins);
$('mult').textContent='x'+(f1Mode?F1.m:CARS[S.active].m);
$('spd').textContent=speed;

checkTimer+=dt;
if(checkTimer>0.5){
checkTimer=0;
checkAch({obgony:obgony,sess:sess,dist:dist,
owned:S.owned,recBeats:S.recBeats,
clownCoins:S.clownCoins,toiletCoins:S.toiletCoins,
f1Used:S.f1Used,offroadDist:S.offroadDist,
secretFound:S.secretFound,bossBeaten:S.bossBeaten});
}
}

function updateOffroad(dt){

if(inp.r)P.vx+=0.9;
P.vx*=0.85;

P.x+=P.vx;

var rw=W*0.75;

var mn=rx+P.w/2;
var mx=rx+rw-P.w/2;
if(P.x<mn){P.x=mn;P.vx=0;}
if(P.x>mx){P.x=mx;P.vx=0;}

if(inp.gas)offroadSpeed+=0.15;
if(inp.brk)offroadSpeed-=0.3;
if(!inp.gas&&!inp.brk)offroadSpeed-=0.03;

function updateSecret(dt){
secretTimer+=dt;
secretDist+=6;

// Управление
if(inp.l)P.vx-=0.9;
if(inp.r)P.vx+=0.9;
P.vx*=0.85;
if(P.vx>9)P.vx=9;
if(P.vx<-9)P.vx=-9;
P.x+=P.vx;
var rw=W*0.7;
var rx=(W-rw)/2;
var mn=rx+P.w/2;
var mx=rx+rw-P.w/2;
if(P.x<mn){P.x=mn;P.vx=0;}
if(P.x>mx){P.x=mx;P.vx=0;}

// Кристаллы скроллятся
for(var i=0;i<crystals.length;i++){
crystals[i].y+=6;
if(crystals[i].y>H+200){
crystals[i].y=-200;
}
}
bgOff+=6;

// Вспышка урона
if(hitFlash>0)hitFlash-=dt*3;

// Фазы
if(secretPhase===0){
// Ждём 2 сек, потом MR BEAN
if(secretTimer>=2){
secretPhase=1;
secretTimer=0;
showMrBeanSecret();
}
}
else if(secretPhase===1){
// После MR BEAN (3.5 сек) появляется босс
if(secretTimer>=3.5){
secretPhase=2;
secretTimer=0;
bossTimer=0;
bossHitCount=0;
// Инициализация босса
boss={
x:W/2,
y:H*0.3,
size:80,
eyeTime:0
};
// Первая атака
scheduleBossAttack();
}
}
else if(secretPhase===2){
// Босс атакует
bossTimer+=dt;
boss.eyeTime+=dt*3;

// Зона удара — активна?
if(bossZone.active){
bossZone.hitTime+=dt;
if(bossZone.hitTime>=0.7 && !bossZone.hit){
// Удар!
bossZone.hit=true;
var dx=P.x-bossZone.x;
var dy=P.y-bossZone.y;
var d=Math.sqrt(dx*dx+dy*dy);
if(d<bossZone.r){
playerHP-=50;
hitFlash=1;
updateHPBar();
if(playerHP<=0){
playerHP=0;
updateHPBar();
secretPhase=99;
gameOn=false;
setTimeout(function(){showDefeat();},800);
return;
}
}
}
if(bossZone.hitTime>=1.0){
// Удар закончился
bossZone.active=false;
bossHitCount++;
if(bossHitCount>=4){
// Босс ушёл
secretPhase=3;
secretTimer=0;
setTimeout(function(){exitSecret();},800);
}else{
// Следующая атака через 1 сек
setTimeout(function(){
if(secretPhase===2)scheduleBossAttack();
},1000);
}
}
}
}
else if(secretPhase===3){
// Выход из локации
if(secretTimer>=0.5){
exitSecret();
}
}

// HUD
$('coins').textContent=fmt(S.coins+coins);
$('mult').textContent='x'+CARS[S.active].m;
$('spd').textContent=Math.floor(secretDist/50);

checkTimer+=dt;
if(checkTimer>0.5){
checkTimer=0;
checkAch({obgony:0,sess:sess,dist:dist,

}
}

function scheduleBossAttack(){
// Случайная зона — большая, но есть куда спрятаться
var rw=W*0.7;
var rx=(W-rw)/2;
// Делим на 3 зоны (лево/центр/право) — только 2 из 3 выбираются, чтобы был безопасный угол
var zones=[rx+rw*0.17,rx+rw*0.5,rx+rw*0.83];
var safeIdx=Math.floor(Math.random()*3);
var attackZones=[];
for(var i=0;i<3;i++){
if(i!==safeIdx)attackZones.push(zones[i]);
}
var zx=attackZones[Math.floor(Math.random()*attackZones.length)];
bossZone={
x:zx,
y:H-140,
r:W*0.22,
active:true,
hit:false,
hitTime:0
};
}

   }function mix(a,b,k){
var pa=[parseInt(a.slice(1,3),16),
parseInt(a.slice(3,5),16),
parseInt(a.slice(5,7),16)];
var pb=[parseInt(b.slice(1,3),16),
parseInt(b.slice(3,5),16),
parseInt(b.slice(5,7),16)];
return'rgb('+
Math.round(pa[0]+(pb[0]-pa[0])*k)+','+
Math.round(pa[1]+(pb[1]-pa[1])*k)+','+
Math.round(pa[2]+(pb[2]-pa[2])*k)+')';
}

function sky(){
var t=timeOfDay;
if(t<0.15)return'#0a0a2a';
if(t<0.3)return mix('#0a0a2a','#ff6b35',(t-0.15)/0.15);
if(t<0.45)return mix('#ff6b35','#87ceeb',(t-0.3)/0.15);
if(t<0.75)return'#87ceeb';
if(t<0.9)return mix('#87ceeb','#ff6b35',(t-0.75)/0.15);
return mix('#ff6b35','#0a0a2a',(t-0.9)/0.1);
}

function isNight(){return timeOfDay<0.15||timeOfDay>0.85;}
function isEve(){return timeOfDay>0.75&&timeOfDay<0.9;}

function rainbowColor(offset){
return 'hsl('+((rainbowHue+offset)%360)+',100%,55%)';
}

function drawCity(){
var rw=W*0.65;
var rx=(W-rw)/2;
var bw=60,gap=90;
var sh=(bgOff*0.5)%gap;
for(var side=0;side<2;side++){
var baseX=side===0?0:rx+rw;
for(var i=-2;i<H/gap+2;i++){
var by=i*gap+sh-gap;
var h=80+((i*31+side*7)%40);
var cols1=['#3a3a45','#4a3a2a','#2a3a4a'];
var cols2=['#4a3a2a','#3a3a45','#5a3a3a'];
var col=side===0?cols1[(i+side)%3]:cols2[(i+side)%3];
ctx.fillStyle='rgba(0,0,0,.4)';
ctx.fillRect(baseX+4,by+4,bw-4,h);
ctx.fillStyle=col;
ctx.fillRect(baseX,by,bw-4,h);
var wr2=Math.floor(h/18);
for(var r=0;r<wr2;r++){
for(var c=0;c<2;c++){
var wx=baseX+10+c*22;
var wy=by+8+r*18;
var lit=false;
if(isNight())lit=((i*17+r*7+c*3+side*11)%10)>4;
else if(isEve())lit=((i*17+r*7+c*3+side*11)%10)>7;
if(lit){
ctx.fillStyle='rgba(255,220,120,.9)';
ctx.fillRect(wx,wy,14,10);
}else{
ctx.fillStyle='rgba(20,25,40,.9)';
ctx.fillRect(wx,wy,14,10);
}
}
}
ctx.fillStyle='rgba(0,0,0,.3)';
ctx.fillRect(baseX,by,bw-4,5);
}
}
ctx.fillStyle=timeOfDay>0.5?'#3a3a3e':'#4a4a4e';
ctx.fillRect(rx-30,0,30,H);
ctx.fillRect(rx+rw,0,30,H);
ctx.strokeStyle='rgba(255,255,255,.15)';
ctx.setLineDash([8,8]);
ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(rx-8,0);ctx.lineTo(rx-8,H);ctx.stroke();
ctx.beginPath();ctx.moveTo(rx+rw+8,0);ctx.lineTo(rx+rw+8,H);ctx.stroke();
ctx.setLineDash([]);
}

function drawOffroadBg(){

ctx.fillRect(0,0,W,H);
var rw=W*0.75;

ctx.fillStyle=timeOfDay>0.5?'#4a3a25':'#8b6f47';
ctx.fillRect(rx,0,rw,H);
var sh=(bgOff*1.2)%80;
for(var i=-2;i<H/80+2;i++){
var y=i*80+sh-80;
for(var j=0;j<12;j++){
var cx=rx+((j*97+i*37)%rw);
var cy=y+((j*41)%60);

function drawSecret(){
// Тёмный фон
ctx.fillStyle='#050208';
ctx.fillRect(0,0,W,H);
// Кристаллы
for(var i=0;i<crystals.length;i++){
var cr=crystals[i];
if(cr.y<-100||cr.y>H+100)continue;
// Свечение
var g=ctx.createRadialGradient(cr.x,cr.y,2,cr.x,cr.y,cr.size*2.5);
g.addColorStop(0,'hsla('+cr.hue+',100%,65%,.8)');
g.addColorStop(0.5,'hsla('+cr.hue+',100%,55%,.3)');
g.addColorStop(1,'hsla('+cr.hue+',100%,50%,0)');
ctx.fillStyle=g;
ctx.beginPath();ctx.arc(cr.x,cr.y,cr.size*2.5,0,7);ctx.fill();
// Кристалл (ромб)
ctx.save();
ctx.translate(cr.x,cr.y);
ctx.rotate(Math.PI/4);
ctx.fillStyle='hsla('+cr.hue+',90%,60%,.9)';
ctx.fillRect(-cr.size/2,-cr.size/2,cr.size,cr.size);
ctx.fillStyle='hsla('+cr.hue+',100%,80%,.7)';
ctx.fillRect(-cr.size/4,-cr.size/2,cr.size/4,cr.size);
ctx.restore();
}
// Земля — тёмная полоса
var rw=W*0.7;
var rx=(W-rw)/2;
ctx.fillStyle='#0a0510';
ctx.fillRect(rx,0,rw,H);
ctx.strokeStyle='rgba(120,40,180,.3)';
ctx.setLineDash([15,15]);
ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(rx,0);ctx.lineTo(rx,H);ctx.stroke();
ctx.beginPath();ctx.moveTo(rx+rw,0);ctx.lineTo(rx+rw,H);ctx.stroke();
ctx.setLineDash([]);

// Фаза 2 — босс
if(secretPhase===2){
// Зона удара (предупреждение)
if(bossZone.active&&!bossZone.hit){
var zp=bossZone.hitTime/0.7;
ctx.fillStyle='rgba(255,0,0,'+(0.15+zp*0.35)+')';
ctx.beginPath();
ctx.ellipse(bossZone.x,bossZone.y,bossZone.r,bossZone.r*0.6,0,0,7);
ctx.fill();
ctx.strokeStyle='rgba(255,50,50,'+(0.5+zp*0.5)+')';
ctx.lineWidth=4;
ctx.beginPath();
ctx.ellipse(bossZone.x,bossZone.y,bossZone.r,bossZone.r*0.6,0,0,7);
ctx.stroke();
}
// Зона удара — момент удара (вспышка)
if(bossZone.hit&&bossZone.active){
ctx.fillStyle='rgba(255,0,0,.7)';
ctx.beginPath();
ctx.ellipse(bossZone.x,bossZone.y,bossZone.r,bossZone.r*0.6,0,0,7);
ctx.fill();
}
// Босс — серый треугольник с красными глазами
var bx=boss.x;
var by=boss.y-Math.sin(boss.eyeTime)*8;
var bs=boss.size;
// Тень
ctx.fillStyle='rgba(0,0,0,.6)';
ctx.beginPath();
ctx.ellipse(bx+5,by+bs*0.5,bs*0.7,bs*0.25,0,0,7);
ctx.fill();
// Треугольник
ctx.fillStyle='#6a6a6a';
ctx.beginPath();
ctx.moveTo(bx,by-bs*0.6);
ctx.lineTo(bx-bs*0.7,by+bs*0.5);
ctx.lineTo(bx+bs*0.7,by+bs*0.5);
ctx.closePath();
ctx.fill();
// Тёмная сторона
ctx.fillStyle='#4a4a4a';
ctx.beginPath();
ctx.moveTo(bx,by-bs*0.6);
ctx.lineTo(bx+bs*0.7,by+bs*0.5);
ctx.lineTo(bx+bs*0.2,by+bs*0.5);
ctx.closePath();
ctx.fill();
// Красные глаза
ctx.fillStyle='#e53935';
ctx.beginPath();ctx.arc(bx-bs*0.18,by,5,0,7);ctx.fill();
ctx.beginPath();ctx.arc(bx+bs*0.18,by,5,0,7);ctx.fill();
// Свечение глаз
ctx.save();
ctx.globalCompositeOperation='lighter';
ctx.fillStyle='rgba(255,50,50,.5)';
ctx.beginPath();ctx.arc(bx-bs*0.18,by,12,0,7);ctx.fill();
ctx.beginPath();ctx.arc(bx+bs*0.18,by,12,0,7);ctx.fill();
ctx.restore();
}
// Машина игрока
if(P)drawPickup(P.x,P.y,P.w,P.h,'#8b6f47',null);

// Вспышка урона
if(hitFlash>0){
ctx.fillStyle='rgba(255,0,0,'+hitFlash*0.5+')';
ctx.fillRect(0,0,W,H);
}

// Подсказка про уклонение
if(secretPhase===2&&bossZone.active&&!bossZone.hit){
ctx.fillStyle='rgba(255,255,255,.7)';
ctx.font='bold 14px sans-serif';
ctx.textAlign='center';
ctx.fillText('⚠️ УКЛОНЯЙСЯ!',W/2,70);
}
}

function draw(){

else if(gameMode==='offroad')drawOffroad();
else if(gameMode==='secret')drawSecret();
drawFloats();
}

function drawOvertake(){

}
drawCity();

var rw=W*0.65;

for(var i=0;i<lines.length;i++){
ctx.fillRect(W/2-3,lines[i].y,6,45);
}

for(i=0;i<enemies.length;i++){

if(isNight()&&!rainbowMode){

function drawFloats(){
ctx.font='bold 18px sans-serif';

}

ctx.fillRect(-w/2+7,-h/2+22,w-14,10);

ctx.fillStyle='rgba(15,20,30,.85)';
ctx.beginPath();
ctx.moveTo(-w/2+9,h/2-28);
ctx.lineTo(w/2-9,h/2-28);
ctx.lineTo(w/2-7,h/2-14);
ctx.lineTo(-w/2+7,h/2-14);
ctx.closePath();ctx.fill();

ctx.fillStyle='#fff9c4';
ctx.beginPath();ctx.ellipse(-w/2+8,-h/2+3,5,3,0,0,7);ctx.fill();
ctx.beginPath();ctx.ellipse(w/2-8,-h/2+3,5,3,0,0,7);ctx.fill();

ctx.fillStyle='#c62828';
ctx.fillRect(-w/2+4,h/2-6,7,4);

ctx.fillStyle='#0a0a0a';

ctx.fillRect(-w/2-3,h/2-22,6,18);
ctx.fillRect(w/2-3,h/2-22,6,18);

ctx.strokeStyle='rgba(255,255,255,.2)';
ctx.lineWidth=1;
ctx.strokeRect(-w/2+1,-h/2+1,w-2,h-2);

ctx.restore();
}

function loop(n){
var dt=Math.min((n-lt)/1000,.05);
lt=n;
if(W<=0||H<=0)resize();
update(dt);
draw();
requestAnimationFrame(loop);
}
